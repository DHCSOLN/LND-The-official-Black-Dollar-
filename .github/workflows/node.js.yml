    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    # Changed from npm ci to handle missing lockfiles
    - run: npm install
    - run: npm run build --if-present
    - run: npm test
